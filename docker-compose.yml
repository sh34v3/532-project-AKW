services:
  caddy:
    image: caddy:2
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      producer-0:
        condition: service_healthy


  producer-0:
    build: ./producer-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    environment:
      - PORT=4000
      - CONTAINER_ID=1
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "4000:4000"
    depends_on:
      rabbitmq:
        condition: service_healthy


  producer-1:
    build: ./producer-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    environment:
      - PORT=4001
      - CONTAINER_ID=2
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "4001:4001"

    depends_on:
      rabbitmq:
        condition: service_healthy

  producer-2:
    build: ./producer-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    environment:
      - PORT=4002
      - CONTAINER_ID=3
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "4002:4002"
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck: # this configures a healthcheck for docker-compose to run
      test: rabbitmq-diagnostics -q ping #cli command to run as a test
      interval: 5s # how often to run it
      timeout: 5s # how long to wait until retrying
      retries: 10 # how many retries
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest


  flink-jobmanager:
    image: flink:2.2-java17
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - "FLINK_PROPERTIES=jobmanager.rpc.address: flink"
    
  flink-client:
    build: ./flink-client
    restart: on-failure
    depends_on:
      flink-jobmanager:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - JOBMANAGER_ADDRESS=flink-jobmanager:8081
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - MODEL_DIR=/models/gametox-distilbert
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    volumes:
      - ./flink-client:/app
      - ./output:/output
      - ./models:/models:ro

  trainer:
    build: ./trainer
    profiles: ["train"]
    volumes:
      - ./data:/data:ro # GameTox train file
      - ./models:/models

  elasticsearch:
    build: ./elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # this is just for the elasticsearch ui
  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata:
